<!doctype html>
<!--
  LBW DEEP SURRENDER · tier2 · list (2 to 4 items revealed one by one)
  TRANSPARENT: a frosted panel in the right column (x 1176 to 1776), clear of a
  centered or left-of-center speaker. Items surface one at a time behind a
  short gold dash. Mirror .panel to the left if the speaker is framed right.
  Slots: eyebrow, headline, items (list of 2 to 4 <li>).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }
      #lbw-t2-list {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; font-family: var(--font-body);
      }
      #lbw-t2-list .panel {
        position: absolute; right: var(--safe-x); top: 250px; width: 600px; box-sizing: border-box;
        padding: 46px 52px 40px;
        background: var(--glass-bg); border: var(--glass-border); border-radius: var(--radius);
        backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--glass-shadow);
      }
      #lbw-t2-list .eyebrow {
        font-weight: var(--wt-semi); font-size: 18px; letter-spacing: var(--track-eyebrow);
        text-transform: uppercase; color: var(--warm-sand);
      }
      #lbw-t2-list .headline {
        margin: 14px 0 26px; font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-headline); line-height: 1.15; color: var(--cream); text-wrap: balance;
      }
      #lbw-t2-list ul { margin: 0; padding: 0; list-style: none; }
      #lbw-t2-list li {
        position: relative; padding: 16px 0 16px 44px; border-top: 1px solid var(--cream-12);
        font-weight: var(--wt-body); font-size: 32px; line-height: 1.35; color: var(--cream); text-wrap: balance;
      }
      #lbw-t2-list li::before {
        content: ""; position: absolute; left: 0; top: 38px; width: 22px; height: var(--hairline); background: var(--gold);
      }
    </style>
  </head>
  <body>
    <div id="lbw-t2-list" data-composition-id="lbw-t2-list" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div class="panel">
        <div class="eyebrow" data-slot="eyebrow">Before you start</div>
        <div class="headline" data-slot="headline">Set up your space</div>
        <ul data-slot="items">
          <li>Sit or lie down comfortably</li>
          <li>Silence your phone</li>
          <li>Keep water within reach</li>
        </ul>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const R = "#lbw-t2-list ";
      const D = parseFloat(document.getElementById("lbw-t2-list").dataset.duration) || 5;
      const items = document.querySelectorAll(R + "li");
      // spread the reveals so the last item lands with at least 1.6s of hold before the exit
      const step = Math.min(0.6, Math.max(0.3, (D - 3.4) / Math.max(1, items.length - 1)));
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(R + ".panel", { autoAlpha: 0, y: 24 },
                { autoAlpha: 1, y: 0, duration: 1.1, ease: "expo.out" }, 0.1)
        .fromTo(R + ".eyebrow", { autoAlpha: 0, y: 8 },
                { autoAlpha: 1, y: 0, duration: 1.0, ease: "expo.out" }, 0.4)
        .fromTo(R + ".headline", { autoAlpha: 0, y: 12, filter: "blur(6px)" },
                { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 1.3, ease: "expo.out" }, 0.55)
        .fromTo(items, { autoAlpha: 0, x: 14, filter: "blur(5px)" },
                { autoAlpha: 1, x: 0, filter: "blur(0px)", duration: 1.1, ease: "expo.out", stagger: step }, 1.0)
        .to(R + ".panel", { autoAlpha: 0, y: 12, duration: 0.7, ease: "sine.inOut" }, D - 0.7);
      window.__timelines["lbw-t2-list"] = tl;
    </script>
  </body>
</html>
