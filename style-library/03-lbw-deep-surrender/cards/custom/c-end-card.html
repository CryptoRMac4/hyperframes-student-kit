<!doctype html>
<!--
  LBW DEEP SURRENDER · custom · end-card (wordmark + one CTA)
  The site wordmark, LIQUID BREATHWORK in Playfair Display 700 Warm Sand with
  0.05em tracking (never the drip logo), a gold hairline, and one ghost-button
  CTA. Holds to the last frame with the depth light still drifting. Opaque.
  Slots: cta.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: var(--abyss); }
      #lbw-custom-end-card {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--abyss); color: var(--cream);
        font-family: var(--font-body); overflow: hidden;
      }
      #lbw-custom-end-card .ground { position: absolute; inset: 0; background: var(--ground); }
      #lbw-custom-end-card .light { position: absolute; width: 1500px; height: 1100px; border-radius: 50%; background: var(--depth-light); }
      #lbw-custom-end-card .l1 { left: 210px; top: -500px; opacity: 0.9; }
      #lbw-custom-end-card .l2 { left: 400px; top: 520px; opacity: 0.55; }
      #lbw-custom-end-card .vignette { position: absolute; inset: 0; background: var(--vignette); }
      #lbw-custom-end-card .grain { position: absolute; inset: 0; background: var(--tex-grain); background-size: 220px 220px; opacity: 0.05; mix-blend-mode: soft-light; }
      #lbw-custom-end-card .content {
        position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }
      #lbw-custom-end-card .wordmark {
        font-family: var(--font-display); font-weight: var(--wt-bold); font-size: 104px; line-height: 1.1;
        letter-spacing: var(--track-wordmark); color: var(--warm-sand); white-space: nowrap;
      }
      #lbw-custom-end-card .rule { width: 160px; height: var(--hairline); background: var(--gold); margin: 48px 0 64px; }
      #lbw-custom-end-card .cta {
        display: flex; align-items: center; padding: 24px 56px 25px;
        border: 2px solid var(--gold); border-radius: var(--radius-sm);
      }
      #lbw-custom-end-card .cta span {
        font-weight: var(--wt-semi); font-size: 32px; letter-spacing: 0.01em; color: var(--cream); white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="lbw-custom-end-card" data-composition-id="lbw-custom-end-card" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="ground" data-layout-ignore></div>
      <div class="light l1" data-layout-ignore></div>
      <div class="light l2" data-layout-ignore></div>
      <div class="vignette" data-layout-ignore></div>
      <div class="grain" data-layout-ignore></div>
      <div class="content">
        <div class="wordmark">LIQUID BREATHWORK</div>
        <div class="rule"></div>
        <div class="cta"><span data-slot="cta">Find a class at liquidbreathwork.com</span></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const R = "#lbw-custom-end-card ";
      const D = parseFloat(document.getElementById("lbw-custom-end-card").dataset.duration) || 6;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(R + ".l1", { x: 0, y: 0 }, { x: 140, y: 60, duration: D, ease: "sine.inOut" }, 0)
        .fromTo(R + ".l2", { x: 0, y: 0 }, { x: -120, y: -40, duration: D, ease: "sine.inOut" }, 0)
        .fromTo(R + ".wordmark", { autoAlpha: 0, y: 16, filter: "blur(12px)" },
                { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 2.2, ease: "expo.out" }, 0.35)
        .fromTo(R + ".rule", { scaleX: 0 }, { scaleX: 1, duration: 1.6, ease: "sine.inOut" }, 1.2)
        .fromTo(R + ".cta", { autoAlpha: 0, y: 16, filter: "blur(6px)" },
                { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 1.5, ease: "expo.out" }, 2.0);
      window.__timelines["lbw-custom-end-card"] = tl;
    </script>
  </body>
</html>
