<!doctype html>
<!--
  LBW DEEP SURRENDER · tier1 · stat (full-screen takeover)
  A single Playfair figure on the left, a gold hairline that draws open
  vertically like an inhale, and the meaning set beside it. Opaque.
  Slots: kicker, stat, label, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: var(--abyss); }
      #lbw-t1-stat {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--abyss); color: var(--cream);
        font-family: var(--font-body); overflow: hidden;
      }
      #lbw-t1-stat .ground { position: absolute; inset: 0; background: var(--ground); }
      #lbw-t1-stat .light { position: absolute; width: 1500px; height: 1100px; border-radius: 50%; background: var(--depth-light); }
      #lbw-t1-stat .l1 { left: -360px; top: -120px; opacity: 0.9; }
      #lbw-t1-stat .l2 { left: 900px; top: 380px; opacity: 0.55; }
      #lbw-t1-stat .vignette { position: absolute; inset: 0; background: var(--vignette); }
      #lbw-t1-stat .grain { position: absolute; inset: 0; background: var(--tex-grain); background-size: 220px 220px; opacity: 0.05; mix-blend-mode: soft-light; }
      #lbw-t1-stat .content {
        position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
        display: flex; align-items: center; justify-content: center; gap: 88px;
      }
      #lbw-t1-stat .numcol { text-align: right; min-width: 520px; }
      #lbw-t1-stat .kicker {
        font-weight: var(--wt-semi); font-size: var(--size-label);
        letter-spacing: var(--track-eyebrow); text-transform: uppercase;
        color: var(--warm-sand); margin: 0 6px 18px 0;
      }
      #lbw-t1-stat .stat {
        font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-mega); line-height: 1; letter-spacing: -0.01em;
        font-variant-numeric: lining-nums tabular-nums;
        color: var(--cream); white-space: nowrap;
      }
      #lbw-t1-stat .divider { width: var(--hairline); height: 340px; background: var(--gold); flex: none; }
      #lbw-t1-stat .textcol { width: 680px; }
      #lbw-t1-stat .label {
        margin: 0; font-family: var(--font-display); font-weight: var(--wt-semi);
        font-size: 58px; line-height: 1.2; color: var(--cream); text-wrap: balance;
      }
      #lbw-t1-stat .source {
        margin-top: 36px; font-weight: var(--wt-med); font-size: var(--size-tiny);
        letter-spacing: var(--track-eyebrow); text-transform: uppercase; color: var(--warm-sand);
      }
    </style>
  </head>
  <body>
    <div id="lbw-t1-stat" data-composition-id="lbw-t1-stat" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="ground" data-layout-ignore></div>
      <div class="light l1" data-layout-ignore></div>
      <div class="light l2" data-layout-ignore></div>
      <div class="vignette" data-layout-ignore></div>
      <div class="grain" data-layout-ignore></div>
      <div class="content">
        <div class="numcol">
          <div class="kicker" data-slot="kicker">Today's pattern</div>
          <div class="stat" data-slot="stat">4-4-6</div>
        </div>
        <div class="divider"></div>
        <div class="textcol">
          <p class="label" data-slot="label">Inhale for four, hold for four, and exhale for six</p>
          <div class="source" data-slot="source">Seconds per phase</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const R = "#lbw-t1-stat ";
      const D = parseFloat(document.getElementById("lbw-t1-stat").dataset.duration) || 6;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(R + ".l1", { x: 0, y: 0 }, { x: 150, y: -40, duration: D, ease: "sine.inOut" }, 0)
        .fromTo(R + ".l2", { x: 0, y: 0 }, { x: -110, y: 50, duration: D, ease: "sine.inOut" }, 0)
        .fromTo(R + ".kicker", { autoAlpha: 0, y: 12, filter: "blur(6px)" },
                { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 1.2, ease: "expo.out" }, 0.3)
        .fromTo(R + ".stat", { autoAlpha: 0, y: 28, scale: 0.98, filter: "blur(14px)" },
                { autoAlpha: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 2.0, ease: "expo.out" }, 0.55)
        .fromTo(R + ".divider", { scaleY: 0 }, { scaleY: 1, duration: 1.6, ease: "sine.inOut" }, 1.0)
        .fromTo(R + ".label", { autoAlpha: 0, y: 18, filter: "blur(8px)" },
                { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 1.6, ease: "expo.out" }, 1.5)
        .fromTo(R + ".source", { autoAlpha: 0, y: 10 },
                { autoAlpha: 1, y: 0, duration: 1.2, ease: "expo.out" }, 2.1)
        .to(R + ".content", { autoAlpha: 0, y: -12, filter: "blur(6px)", duration: 0.8, ease: "sine.inOut" }, D - 0.8);
      window.__timelines["lbw-t1-stat"] = tl;
    </script>
  </body>
</html>
