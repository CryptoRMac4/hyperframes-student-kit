<!doctype html>
<!--
  LBW DEEP SURRENDER · tier1 · quote (with attribution)
  A single gold quotation mark, the quote in Playfair italic surfacing from
  soft focus, then a short gold hairline and the attribution. Opaque.
  Slots: quote, name, role.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: var(--abyss); }
      #lbw-t1-quote {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--abyss); color: var(--cream);
        font-family: var(--font-body); overflow: hidden;
      }
      #lbw-t1-quote .ground { position: absolute; inset: 0; background: var(--ground); }
      #lbw-t1-quote .light { position: absolute; width: 1500px; height: 1100px; border-radius: 50%; background: var(--depth-light); }
      #lbw-t1-quote .l1 { left: 210px; top: -420px; opacity: 0.85; }
      #lbw-t1-quote .l2 { left: 600px; top: 560px; opacity: 0.5; }
      #lbw-t1-quote .vignette { position: absolute; inset: 0; background: var(--vignette); }
      #lbw-t1-quote .grain { position: absolute; inset: 0; background: var(--tex-grain); background-size: 220px 220px; opacity: 0.05; mix-blend-mode: soft-light; }
      #lbw-t1-quote .content {
        position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      }
      #lbw-t1-quote .mark {
        height: 96px; font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: 190px; line-height: 0.95; color: var(--gold);
      }
      #lbw-t1-quote .quote {
        margin: 12px 0 0; max-width: 1400px; font-family: var(--font-display);
        font-style: italic; font-weight: var(--wt-semi);
        font-size: var(--size-quote); line-height: 1.3; color: var(--cream); text-wrap: balance;
      }
      #lbw-t1-quote .attrib { margin-top: 58px; display: flex; flex-direction: column; align-items: center; }
      #lbw-t1-quote .rule { width: 64px; height: var(--hairline); background: var(--gold); }
      #lbw-t1-quote .name {
        margin-top: 28px; font-weight: var(--wt-semi); font-size: var(--size-label);
        letter-spacing: var(--track-eyebrow); text-transform: uppercase; color: var(--warm-sand);
      }
      #lbw-t1-quote .role { margin-top: 12px; font-size: 28px; color: var(--cream-80); }
    </style>
  </head>
  <body>
    <div id="lbw-t1-quote" data-composition-id="lbw-t1-quote" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="ground" data-layout-ignore></div>
      <div class="light l1" data-layout-ignore></div>
      <div class="light l2" data-layout-ignore></div>
      <div class="vignette" data-layout-ignore></div>
      <div class="grain" data-layout-ignore></div>
      <div class="content">
        <div class="mark" aria-hidden="true">&ldquo;</div>
        <blockquote class="quote" data-slot="quote">When you change the way you breathe, you change the way you feel.</blockquote>
        <div class="attrib">
          <div class="rule"></div>
          <div class="name" data-slot="name">Student Name</div>
          <div class="role" data-slot="role">Liquid Breathwork graduate</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const R = "#lbw-t1-quote ";
      const D = parseFloat(document.getElementById("lbw-t1-quote").dataset.duration) || 6;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(R + ".l1", { x: 0, y: 0 }, { x: 120, y: 70, duration: D, ease: "sine.inOut" }, 0)
        .fromTo(R + ".l2", { x: 0, y: 0 }, { x: -140, y: -30, duration: D, ease: "sine.inOut" }, 0)
        .fromTo(R + ".mark", { autoAlpha: 0, y: 14 },
                { autoAlpha: 1, y: 0, duration: 1.4, ease: "sine.out" }, 0.25)
        .fromTo(R + ".quote", { autoAlpha: 0, y: 24, filter: "blur(12px)" },
                { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 2.0, ease: "expo.out" }, 0.6)
        .fromTo(R + ".rule", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "sine.inOut" }, 1.7)
        .fromTo(R + ".name", { autoAlpha: 0, y: 10, filter: "blur(4px)" },
                { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 1.2, ease: "expo.out" }, 2.0)
        .fromTo(R + ".role", { autoAlpha: 0, y: 10 },
                { autoAlpha: 1, y: 0, duration: 1.2, ease: "expo.out" }, 2.25)
        .to(R + ".content", { autoAlpha: 0, y: -12, filter: "blur(6px)", duration: 0.8, ease: "sine.inOut" }, D - 0.8);
      window.__timelines["lbw-t1-quote"] = tl;
    </script>
  </body>
</html>
