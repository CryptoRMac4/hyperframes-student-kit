<!doctype html>
<!--
  LBW DEEP SURRENDER · tier1 · section (numbered chapter marker)
  Editorial left-aligned chapter opener: tracked eyebrow, a large Warm Sand
  Playfair numeral, a gold hairline, then the chapter title. Opaque.
  Slots: label, number, title, subtitle.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: var(--abyss); }
      #lbw-t1-section {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--abyss); color: var(--cream);
        font-family: var(--font-body); overflow: hidden;
      }
      #lbw-t1-section .ground { position: absolute; inset: 0; background: var(--ground); }
      #lbw-t1-section .light { position: absolute; width: 1500px; height: 1100px; border-radius: 50%; background: var(--depth-light); }
      #lbw-t1-section .l1 { left: -420px; top: -200px; opacity: 0.95; }
      #lbw-t1-section .l2 { left: 980px; top: 300px; opacity: 0.5; }
      #lbw-t1-section .vignette { position: absolute; inset: 0; background: var(--vignette); }
      #lbw-t1-section .grain { position: absolute; inset: 0; background: var(--tex-grain); background-size: 220px 220px; opacity: 0.05; mix-blend-mode: soft-light; }
      #lbw-t1-section .content {
        position: absolute; left: 240px; top: 0; width: 1440px; height: 1080px;
        display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
      }
      #lbw-t1-section .label {
        font-weight: var(--wt-semi); font-size: var(--size-label);
        letter-spacing: var(--track-eyebrow); text-transform: uppercase; color: var(--warm-sand);
      }
      #lbw-t1-section .number {
        margin-top: 8px; font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: 220px; line-height: 1; font-variant-numeric: lining-nums;
        color: var(--warm-sand);
      }
      #lbw-t1-section .rule { width: 160px; height: var(--hairline); background: var(--gold); margin: 36px 0 48px; }
      #lbw-t1-section .title {
        margin: 0; max-width: 1320px; font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); line-height: var(--lh-display); color: var(--cream); text-wrap: balance;
      }
      #lbw-t1-section .subtitle {
        margin: 26px 0 0; max-width: 980px; font-weight: var(--wt-body);
        font-size: var(--size-body); line-height: var(--lh-body); color: var(--warm-sand); text-wrap: balance;
      }
    </style>
  </head>
  <body>
    <div id="lbw-t1-section" data-composition-id="lbw-t1-section" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div class="ground" data-layout-ignore></div>
      <div class="light l1" data-layout-ignore></div>
      <div class="light l2" data-layout-ignore></div>
      <div class="vignette" data-layout-ignore></div>
      <div class="grain" data-layout-ignore></div>
      <div class="content">
        <div class="label" data-slot="label">Part</div>
        <div class="number" data-slot="number">02</div>
        <div class="rule"></div>
        <h1 class="title" data-slot="title">The Science of Breathing</h1>
        <p class="subtitle" data-slot="subtitle">What actually happens in your body when you slow down</p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const R = "#lbw-t1-section ";
      const D = parseFloat(document.getElementById("lbw-t1-section").dataset.duration) || 5;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(R + ".l1", { x: 0, y: 0 }, { x: 160, y: 40, duration: D, ease: "sine.inOut" }, 0)
        .fromTo(R + ".l2", { x: 0, y: 0 }, { x: -120, y: -40, duration: D, ease: "sine.inOut" }, 0)
        .fromTo(R + ".label", { autoAlpha: 0, y: 12, filter: "blur(6px)" },
                { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 1.2, ease: "expo.out" }, 0.25)
        .fromTo(R + ".number", { autoAlpha: 0, y: 30, filter: "blur(14px)" },
                { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 2.0, ease: "expo.out" }, 0.45)
        .fromTo(R + ".rule", { scaleX: 0, transformOrigin: "0% 50%" },
                { scaleX: 1, transformOrigin: "0% 50%", duration: 1.5, ease: "sine.inOut" }, 0.95)
        .fromTo(R + ".title", { autoAlpha: 0, y: 22, filter: "blur(10px)" },
                { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 1.7, ease: "expo.out" }, 1.2)
        .fromTo(R + ".subtitle", { autoAlpha: 0, y: 14, filter: "blur(6px)" },
                { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 1.4, ease: "expo.out" }, 1.8)
        .to(R + ".content", { autoAlpha: 0, y: -12, filter: "blur(6px)", duration: 0.8, ease: "sine.inOut" }, D - 0.8);
      window.__timelines["lbw-t1-section"] = tl;
    </script>
  </body>
</html>
