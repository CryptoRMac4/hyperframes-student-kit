<!doctype html>
<!--
  LBW DEEP SURRENDER · tier1 · overview (3 to 4 item agenda)
  Title column on the left; numbered rows on the right, separated by Gold 20%
  hairlines, surfacing one after another. Numbers come from a CSS counter, so
  only the item text is filled. Opaque.
  Slots: eyebrow, title, items (list of 3 or 4 <li>).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: var(--abyss); }
      #lbw-t1-overview {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--abyss); color: var(--cream);
        font-family: var(--font-body); overflow: hidden;
      }
      #lbw-t1-overview .ground { position: absolute; inset: 0; background: var(--ground); }
      #lbw-t1-overview .light { position: absolute; width: 1500px; height: 1100px; border-radius: 50%; background: var(--depth-light); }
      #lbw-t1-overview .l1 { left: -420px; top: -80px; opacity: 0.9; }
      #lbw-t1-overview .l2 { left: 900px; top: -360px; opacity: 0.5; }
      #lbw-t1-overview .vignette { position: absolute; inset: 0; background: var(--vignette); }
      #lbw-t1-overview .grain { position: absolute; inset: 0; background: var(--tex-grain); background-size: 220px 220px; opacity: 0.05; mix-blend-mode: soft-light; }
      #lbw-t1-overview .content {
        position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
        display: flex; align-items: center; justify-content: center; gap: 120px;
      }
      #lbw-t1-overview .left { width: 600px; }
      #lbw-t1-overview .eyebrow {
        font-weight: var(--wt-semi); font-size: var(--size-label);
        letter-spacing: var(--track-eyebrow); text-transform: uppercase; color: var(--warm-sand);
      }
      #lbw-t1-overview .rule { width: 80px; height: var(--hairline); background: var(--gold); margin: 30px 0 40px; }
      #lbw-t1-overview .title {
        margin: 0; font-family: var(--font-display); font-weight: var(--wt-bold);
        font-size: var(--size-title); line-height: var(--lh-display); color: var(--cream); text-wrap: balance;
      }
      #lbw-t1-overview .items { width: 840px; margin: 0; padding: 0; list-style: none; counter-reset: agenda; }
      #lbw-t1-overview .items li {
        counter-increment: agenda; display: flex; align-items: baseline; gap: 40px;
        padding: 32px 0; border-top: 1px solid var(--gold-20);
        font-weight: var(--wt-med); font-size: 40px; line-height: 1.3; color: var(--cream); text-wrap: balance;
      }
      #lbw-t1-overview .items li:last-child { border-bottom: 1px solid var(--gold-20); }
      #lbw-t1-overview .items li::before {
        content: counter(agenda, decimal-leading-zero); flex: none; width: 64px;
        font-family: var(--font-display); font-weight: var(--wt-bold); font-size: 40px;
        font-variant-numeric: lining-nums tabular-nums; color: var(--warm-sand);
      }
    </style>
  </head>
  <body>
    <div id="lbw-t1-overview" data-composition-id="lbw-t1-overview" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="ground" data-layout-ignore></div>
      <div class="light l1" data-layout-ignore></div>
      <div class="light l2" data-layout-ignore></div>
      <div class="vignette" data-layout-ignore></div>
      <div class="grain" data-layout-ignore></div>
      <div class="content">
        <div class="left">
          <div class="eyebrow" data-slot="eyebrow">In this lesson</div>
          <div class="rule"></div>
          <h1 class="title" data-slot="title">What we will cover</h1>
        </div>
        <ul class="items" data-slot="items">
          <li>What Breathwork is, and what it is not</li>
          <li>How your nervous system responds</li>
          <li>A guided four minute practice</li>
          <li>Building a simple daily habit</li>
        </ul>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const R = "#lbw-t1-overview ";
      const D = parseFloat(document.getElementById("lbw-t1-overview").dataset.duration) || 6;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(R + ".l1", { x: 0, y: 0 }, { x: 150, y: 50, duration: D, ease: "sine.inOut" }, 0)
        .fromTo(R + ".l2", { x: 0, y: 0 }, { x: -120, y: 60, duration: D, ease: "sine.inOut" }, 0)
        .fromTo(R + ".eyebrow", { autoAlpha: 0, y: 12, filter: "blur(6px)" },
                { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 1.2, ease: "expo.out" }, 0.25)
        .fromTo(R + ".rule", { scaleX: 0, transformOrigin: "0% 50%" },
                { scaleX: 1, transformOrigin: "0% 50%", duration: 1.4, ease: "sine.inOut" }, 0.45)
        .fromTo(R + ".title", { autoAlpha: 0, y: 22, filter: "blur(10px)" },
                { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 1.7, ease: "expo.out" }, 0.6)
        .fromTo(R + ".items li", { autoAlpha: 0, y: 16, filter: "blur(6px)" },
                { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 1.3, ease: "expo.out", stagger: 0.45 }, 1.25)
        .to(R + ".content", { autoAlpha: 0, y: -12, filter: "blur(6px)", duration: 0.8, ease: "sine.inOut" }, D - 0.8);
      window.__timelines["lbw-t1-overview"] = tl;
    </script>
  </body>
</html>
