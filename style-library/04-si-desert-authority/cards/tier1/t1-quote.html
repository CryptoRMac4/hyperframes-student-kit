<!doctype html>
<!--
  SI DESERT AUTHORITY · tier1 · quote (opaque takeover)
  Client words on bone. Oversized sand quotation mark, a source label (where
  the review came from), the quote in Barlow Condensed, then the attribution
  under one short terracotta rule. No star graphics: only real reviews ship.
  Slots: source, quote (no quotation marks), name, business.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: var(--bone); }
      #si-t1-quote {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--bone); color: var(--mesquite); font-family: var(--font-body);
      }
      #si-t1-quote .mark {
        position: absolute; left: 150px; top: 265px; width: 190px; height: 300px;
        font-family: var(--font-display); font-weight: var(--wt-bold); font-size: 520px;
        line-height: 1; color: var(--sand);
      }
      #si-t1-quote .wrap {
        position: absolute; left: 360px; top: 0; width: 1400px; height: 1080px;
        display: flex; flex-direction: column; justify-content: center;
      }
      #si-t1-quote .srcrow { display: flex; align-items: center; }
      #si-t1-quote .source {
        font-family: var(--font-display); font-weight: var(--wt-semi); font-size: 28px;
        letter-spacing: var(--track-eyebrow); text-transform: uppercase; color: var(--adobe);
      }
      #si-t1-quote .quote {
        margin-top: 40px; max-width: 1400px; text-wrap: balance;
        font-family: var(--font-display); font-weight: var(--wt-semi); font-size: 92px;
        line-height: 1.08; letter-spacing: var(--track-display); color: var(--saguaro);
      }
      #si-t1-quote .attr { margin-top: 56px; display: flex; align-items: center; gap: 28px; }
      #si-t1-quote .rule { width: 72px; height: var(--rule); background: var(--terracotta); flex: none; }
      #si-t1-quote .name { font-size: 42px; font-weight: var(--wt-semi); color: var(--mesquite); }
      #si-t1-quote .business { margin-top: 4px; font-size: 32px; font-weight: var(--wt-medium); color: var(--mesquite-dim); }
    </style>
  </head>
  <body>
    <div id="si-t1-quote" data-composition-id="si-t1-quote" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="mark" aria-hidden="true">&ldquo;</div>
      <div class="wrap">
        <div class="srcrow">
          <span class="source" data-slot="source">Review source</span>
        </div>
        <div class="quote" data-slot="quote">We used to wait on referrals. Now the phone rings from Google every single week.</div>
        <div class="attr">
          <div class="rule"></div>
          <div>
            <div class="name" data-slot="name">Client Name, Business</div>
            <div class="business" data-slot="business">City, AZ</div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = document.getElementById("si-t1-quote");
        const css = getComputedStyle(document.documentElement);
        const ease = (k, d) => css.getPropertyValue(k).trim() || d;
        const IN = ease("--gsap-in", "power3.out"), WIPE = ease("--gsap-wipe", "power2.inOut");
        const OUT = ease("--gsap-out", "power2.in");
        const q = (s) => root.querySelector(s), qa = (s) => root.querySelectorAll(s);

        const tl = gsap.timeline({ paused: true });
        tl.fromTo(q(".mark"), { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.8, ease: IN }, 0)
          .fromTo(q(".source"), { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: IN }, 0.2)
          .fromTo(q(".quote"), { autoAlpha: 0, y: 44 }, { autoAlpha: 1, y: 0, duration: 0.85, ease: IN }, 0.45)
          .fromTo(q(".rule"), { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.5, ease: WIPE }, 1.35)
          .fromTo(q(".attr > div:last-child"), { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: IN }, 1.55)
          .fromTo(q(".wrap"), { y: 0 }, { y: -8, duration: 3.4, ease: "none" }, 2.15)
          .to([q(".mark"), q(".wrap")], { autoAlpha: 0, y: -48, duration: 0.45, ease: OUT }, 5.55);
        window.__timelines["si-t1-quote"] = tl;
      })();
    </script>
  </body>
</html>
