<!doctype html>
<!--
  SI DESERT AUTHORITY · tier1 · section (opaque takeover)
  Chapter marker. A saguaro panel wipes off to the right revealing sand; a big
  tabular section numeral rises out of a mask on the left, an adobe hairline
  draws down, then eyebrow + title with one short terracotta rule.
  Slots: number (2 chars), kicker, title.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: var(--sand); }
      #si-t1-section {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--sand); color: var(--mesquite); font-family: var(--font-body);
      }
      #si-t1-section .num-mask {
        position: absolute; left: 150px; top: 290px; width: 600px; height: 470px; overflow: hidden;
      }
      #si-t1-section .num {
        font-family: var(--font-display); font-weight: var(--wt-bold); font-size: 520px;
        line-height: 0.9; letter-spacing: -0.02em; color: var(--saguaro);
        font-variant-numeric: tabular-nums lining-nums; white-space: nowrap;
      }
      #si-t1-section .vrule {
        position: absolute; left: 790px; top: 250px; width: 2px; height: 580px; background: var(--adobe-line);
      }
      #si-t1-section .text {
        position: absolute; left: 870px; top: 0; width: 900px; height: 1080px;
        display: flex; flex-direction: column; justify-content: center;
      }
      #si-t1-section .kicker {
        display: flex; align-items: center; gap: 22px;
        font-family: var(--font-display); font-weight: var(--wt-semi); font-size: 28px;
        letter-spacing: var(--track-eyebrow); text-transform: uppercase; color: var(--adobe);
      }
      #si-t1-section .kicker .dash { width: 56px; height: 3px; background: var(--adobe); flex: none; }
      #si-t1-section .title {
        margin-top: 26px; max-width: 900px; text-wrap: balance;
        font-family: var(--font-display); font-weight: var(--wt-bold); font-size: 124px;
        line-height: 1.0; letter-spacing: var(--track-display); color: var(--mesquite);
      }
      #si-t1-section .rule { width: 160px; height: var(--rule); background: var(--terracotta); margin-top: 40px; }
      #si-t1-section .wipe {
        position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: var(--saguaro);
      }
    </style>
  </head>
  <body>
    <div id="si-t1-section" data-composition-id="si-t1-section" data-start="0" data-duration="4.5" data-width="1920" data-height="1080">
      <div class="num-mask"><div class="num" data-slot="number">02</div></div>
      <div class="vrule"></div>
      <div class="text">
        <div class="kicker"><span class="dash"></span><span data-slot="kicker">Part two</span></div>
        <div class="title" data-slot="title">Get found on Google Maps</div>
        <div class="rule"></div>
      </div>
      <div class="wipe"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = document.getElementById("si-t1-section");
        const css = getComputedStyle(document.documentElement);
        const ease = (k, d) => css.getPropertyValue(k).trim() || d;
        const IN = ease("--gsap-in", "power3.out"), WIPE = ease("--gsap-wipe", "power2.inOut");
        const OUT = ease("--gsap-out", "power2.in");
        const q = (s) => root.querySelector(s);

        const tl = gsap.timeline({ paused: true });
        tl.fromTo(q(".wipe"), { scaleX: 1, transformOrigin: "right center" }, { scaleX: 0, duration: 0.7, ease: WIPE }, 0)
          .fromTo(q(".num"), { yPercent: 100 }, { yPercent: 0, duration: 0.85, ease: IN }, 0.35)
          .fromTo(q(".vrule"), { scaleY: 0, transformOrigin: "center top" }, { scaleY: 1, duration: 0.8, ease: WIPE }, 0.45)
          .fromTo(q(".kicker"), { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: IN }, 0.6)
          .fromTo(q(".title"), { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.75, ease: IN }, 0.7)
          .fromTo(q(".rule"), { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.55, ease: WIPE }, 1.3)
          .fromTo(q(".text"), { y: 0 }, { y: -6, duration: 2.2, ease: "none" }, 1.85)
          .to([q(".num-mask"), q(".vrule"), q(".text")], { autoAlpha: 0, y: -40, duration: 0.45, ease: OUT, stagger: 0.04 }, 3.97);
        window.__timelines["si-t1-section"] = tl;
      })();
    </script>
  </body>
</html>
