<!doctype html>
<!--
  SI DESERT AUTHORITY · tier1 · stat (opaque takeover)
  Saguaro field with the pack's horizon motif (hairline horizon + two sun arcs
  that draw in). Eyebrow with a short sand rule, a huge tabular Barlow Condensed
  number that counts up from 0, one terracotta underline, then the label.
  The stat slot is parsed as prefix + number + suffix ("74%", "$8,000", "3.4x").
  The slot element stays as an invisible ghost of the final text so the box is
  sized in the real font and the count-up never reflows.
  Slots: kicker, stat, label, source.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: var(--saguaro); }
      #si-t1-stat {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--saguaro); color: var(--bone); font-family: var(--font-body);
      }
      #si-t1-stat .horizon { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #si-t1-stat .horizon path { fill: none; stroke: var(--bone-line); stroke-width: 2; stroke-dasharray: 100; }
      #si-t1-stat .wrap {
        position: absolute; left: 180px; top: 60px; width: 1560px; height: 860px;
        display: flex; flex-direction: column; justify-content: center;
      }
      #si-t1-stat .kicker {
        display: flex; align-items: center; gap: 22px;
        font-family: var(--font-display); font-weight: var(--wt-semi); font-size: var(--size-label);
        letter-spacing: var(--track-eyebrow); text-transform: uppercase; color: var(--sand);
      }
      #si-t1-stat .kicker .dash { width: 56px; height: 3px; background: var(--sand); flex: none; }
      #si-t1-stat .stat {
        margin-top: 18px; align-self: flex-start; display: grid;
        font-family: var(--font-display); font-weight: var(--wt-bold); font-size: var(--size-mega);
        line-height: 0.9; letter-spacing: -0.01em; color: var(--bone);
        font-variant-numeric: tabular-nums lining-nums; white-space: nowrap;
      }
      #si-t1-stat .stat [data-slot="stat"], #si-t1-stat .stat .count { grid-area: 1 / 1; }
      #si-t1-stat .stat [data-slot="stat"] { visibility: hidden; }
      #si-t1-stat .underline { grid-area: 2 / 1; height: var(--rule); background: var(--terracotta); margin-top: 14px; }
      #si-t1-stat .label {
        margin-top: 44px; max-width: 30ch; text-wrap: balance;
        font-weight: var(--wt-medium); font-size: 56px; line-height: 1.22; color: var(--bone);
      }
      #si-t1-stat .source {
        margin-top: 34px; font-size: var(--size-tiny); font-weight: var(--wt-medium);
        letter-spacing: 0.06em; color: var(--bone-dim);
      }
    </style>
  </head>
  <body>
    <div id="si-t1-stat" data-composition-id="si-t1-stat" data-start="0" data-duration="5.5" data-width="1920" data-height="1080">
      <svg class="horizon" viewBox="0 0 1920 1080" aria-hidden="true">
        <path d="M0 930 H1920" pathLength="100" />
        <path d="M1160 930 A 340 340 0 0 1 1840 930" pathLength="100" />
        <path d="M1260 930 A 240 240 0 0 1 1740 930" pathLength="100" />
      </svg>
      <div class="wrap">
        <div class="kicker"><span class="dash"></span><span data-slot="kicker">Before they call you</span></div>
        <div class="stat">
          <span data-slot="stat">74%</span>
          <div class="underline"></div>
        </div>
        <div class="label" data-slot="label">of AI search users read your Google reviews before picking who to call.</div>
        <div class="source" data-slot="source">Source: add source</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = document.getElementById("si-t1-stat");
        const css = getComputedStyle(document.documentElement);
        const ease = (k, d) => css.getPropertyValue(k).trim() || d;
        const IN = ease("--gsap-in", "power3.out"), WIPE = ease("--gsap-wipe", "power2.inOut");
        const OUT = ease("--gsap-out", "power2.in"), COUNT = ease("--gsap-count", "power2.out");
        const q = (s) => root.querySelector(s), qa = (s) => root.querySelectorAll(s);

        // Parse "prefix number suffix" once, at build time (deterministic).
        function counterFor(slotEl) {
          const raw = slotEl.textContent.trim();
          const m = raw.match(/^([^0-9]*)([0-9][0-9,]*\.?[0-9]*)(.*)$/);
          const pre = m ? m[1] : "", suf = m ? m[3] : "";
          const digits = m ? m[2].replace(/,/g, "") : "0";
          const target = parseFloat(digits) || 0;
          const dec = digits.includes(".") ? digits.split(".")[1].length : 0;
          const commas = m ? m[2].includes(",") : false;
          const live = document.createElement("span");
          live.className = "count";
          slotEl.after(live);
          const state = { v: 0 };
          const paint = () => {
            const s = commas
              ? state.v.toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec })
              : state.v.toFixed(dec);
            live.textContent = m ? pre + s + suf : raw;
          };
          paint();
          return { state, target, paint };
        }
        const c = counterFor(q('[data-slot="stat"]'));

        const tl = gsap.timeline({ paused: true });
        tl.fromTo(qa(".horizon path"), { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 1.6, ease: WIPE, stagger: 0.18 }, 0)
          .fromTo(q(".kicker"), { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: IN }, 0.1)
          .fromTo(q(".stat"), { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: IN }, 0.25)
          .fromTo(c.state, { v: 0 }, { v: c.target, duration: 1.3, ease: COUNT, onUpdate: c.paint }, 0.3)
          .fromTo(q(".underline"), { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.6, ease: WIPE }, 1.35)
          .fromTo(q(".label"), { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: IN }, 1.1)
          .fromTo(q(".source"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5, ease: IN }, 1.6)
          .fromTo(q(".wrap"), { y: 0 }, { y: -8, duration: 3.25, ease: "none" }, 1.8)
          .to(q(".wrap"), { autoAlpha: 0, y: -48, duration: 0.45, ease: OUT }, 5.05);
        window.__timelines["si-t1-stat"] = tl;
      })();
    </script>
  </body>
</html>
