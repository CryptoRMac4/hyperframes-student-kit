<!doctype html>
<!--
  SI DESERT AUTHORITY · custom · score-gauge (opaque takeover)
  Audit score on saguaro. A 240-degree ring fills in sand to the score while the
  tabular number counts up; the single terracotta marker rides the ring to the
  value. Right column: business, a text grade chip (grade is words, never hue),
  and the one-line finding.
  Slots: kicker, business, score (0-100), grade, note.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: var(--saguaro); }
      #si-c-score-gauge {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--saguaro); color: var(--bone); font-family: var(--font-body);
      }
      #si-c-score-gauge .gauge { position: absolute; left: 150px; top: 200px; width: 660px; height: 660px; }
      #si-c-score-gauge .gauge .track, #si-c-score-gauge .gauge .fill { fill: none; stroke-width: 36; }
      #si-c-score-gauge .gauge .track { stroke: var(--bone-line); }
      #si-c-score-gauge .gauge .fill { stroke: var(--sand); stroke-dasharray: 100; }
      #si-c-score-gauge .gauge .marker { stroke: var(--terracotta); stroke-width: 10; stroke-linecap: round; }
      #si-c-score-gauge .gauge text {
        font-family: var(--font-display); font-weight: var(--wt-semi); font-size: 26px;
        fill: var(--bone-dim); letter-spacing: 0.08em;
      }
      #si-c-score-gauge .readout {
        position: absolute; left: 150px; top: 200px; width: 660px; height: 600px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }
      #si-c-score-gauge .num {
        display: grid; justify-items: center;
        font-family: var(--font-display); font-weight: var(--wt-bold); font-size: 230px; line-height: 0.9;
        color: var(--bone); font-variant-numeric: tabular-nums lining-nums; white-space: nowrap;
      }
      #si-c-score-gauge .num [data-slot], #si-c-score-gauge .num .count { grid-area: 1 / 1; }
      #si-c-score-gauge .num [data-slot] { visibility: hidden; }
      #si-c-score-gauge .of {
        margin-top: 8px; font-family: var(--font-display); font-weight: var(--wt-semi); font-size: 28px;
        letter-spacing: var(--track-eyebrow); text-transform: uppercase; color: var(--sand);
      }
      #si-c-score-gauge .side {
        position: absolute; left: 930px; top: 0; width: 840px; height: 1080px;
        display: flex; flex-direction: column; justify-content: center;
      }
      #si-c-score-gauge .kicker {
        display: flex; align-items: center; gap: 22px;
        font-family: var(--font-display); font-weight: var(--wt-semi); font-size: var(--size-label);
        letter-spacing: var(--track-eyebrow); text-transform: uppercase; color: var(--sand);
      }
      #si-c-score-gauge .kicker .dash { width: 56px; height: 3px; background: var(--sand); flex: none; }
      #si-c-score-gauge .business {
        margin-top: 22px; text-wrap: balance;
        font-family: var(--font-display); font-weight: var(--wt-bold); font-size: 104px;
        line-height: 1.0; letter-spacing: var(--track-display); color: var(--bone);
      }
      #si-c-score-gauge .grade { margin-top: 40px; display: flex; align-items: center; gap: 22px; }
      #si-c-score-gauge .grade .glab {
        font-family: var(--font-display); font-weight: var(--wt-semi); font-size: 28px;
        letter-spacing: var(--track-eyebrow); text-transform: uppercase; color: var(--bone-dim);
      }
      #si-c-score-gauge .grade .chip {
        padding: 8px 26px 10px; border: 3px solid var(--bone); border-radius: var(--radius);
        font-family: var(--font-display); font-weight: var(--wt-bold); font-size: 50px; line-height: 1;
        letter-spacing: 0.06em; text-transform: uppercase; color: var(--bone); white-space: nowrap;
      }
      #si-c-score-gauge .note {
        margin-top: 40px; max-width: 30ch; text-wrap: balance;
        font-size: 40px; line-height: 1.35; font-weight: var(--wt-body); color: var(--sand);
      }
    </style>
  </head>
  <body>
    <div id="si-c-score-gauge" data-composition-id="si-c-score-gauge" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <svg class="gauge" viewBox="0 0 600 600" aria-hidden="true">
        <path class="track" d="M83.5 425 A 250 250 0 1 1 516.5 425" />
        <path class="fill" d="M83.5 425 A 250 250 0 1 1 516.5 425" pathLength="100" />
        <g class="marker-g"><line class="marker" x1="522" y1="300" x2="590" y2="300" /></g>
        <text x="83.5" y="500" text-anchor="middle">0</text>
        <text x="516.5" y="500" text-anchor="middle">100</text>
      </svg>
      <div class="readout">
        <div class="num"><span data-slot="score">38</span></div>
        <div class="of">out of 100</div>
      </div>
      <div class="side">
        <div class="kicker"><span class="dash"></span><span data-slot="kicker">Local search audit</span></div>
        <div class="business" data-slot="business">Your Business</div>
        <div class="grade"><span class="glab">Grade</span><span class="chip" data-slot="grade">Needs work</span></div>
        <div class="note" data-slot="note">Missing from the Google map for 9 of 12 searches that matter.</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = document.getElementById("si-c-score-gauge");
        const css = getComputedStyle(document.documentElement);
        const ease = (k, d) => css.getPropertyValue(k).trim() || d;
        const IN = ease("--gsap-in", "power3.out"), WIPE = ease("--gsap-wipe", "power2.inOut");
        const OUT = ease("--gsap-out", "power2.in"), COUNT = ease("--gsap-count", "power2.out");
        const q = (s) => root.querySelector(s);

        const slot = q('[data-slot="score"]');
        const score = Math.max(0, Math.min(100, Math.round(parseFloat(slot.textContent) || 0)));
        const live = document.createElement("span");
        live.className = "count";
        slot.after(live);
        const st = { v: 0 };
        const paint = () => { live.textContent = String(Math.round(st.v)); };
        paint();

        const START = 150, SWEEP = 240;   // ring runs clockwise from 150deg to 390deg
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(q(".track"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.6, ease: IN }, 0)
          .fromTo(q(".gauge"), { y: 30 }, { y: 0, duration: 0.8, ease: IN }, 0)
          .fromTo(q(".readout"), { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: IN }, 0.2)
          .fromTo(q(".fill"), { strokeDashoffset: 100 }, { strokeDashoffset: 100 - score, duration: 1.8, ease: COUNT }, 0.6)
          .fromTo(q(".marker-g"), { rotation: START, svgOrigin: "300 300" }, { rotation: START + SWEEP * score / 100, svgOrigin: "300 300", duration: 1.8, ease: COUNT }, 0.6)
          .fromTo(st, { v: 0 }, { v: score, duration: 1.8, ease: COUNT, onUpdate: paint }, 0.6)
          .fromTo(q(".kicker"), { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: IN }, 0.4)
          .fromTo(q(".business"), { autoAlpha: 0, y: 36 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: IN }, 0.5)
          .fromTo(q(".grade"), { autoAlpha: 0, clipPath: "inset(0% 100% 0% 0%)" }, { autoAlpha: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: WIPE }, 2.35)
          .fromTo(q(".note"), { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: IN }, 2.7)
          .to([q(".gauge"), q(".readout"), q(".side")], { autoAlpha: 0, y: -40, duration: 0.45, ease: OUT, stagger: 0.03 }, 5.49);
        window.__timelines["si-c-score-gauge"] = tl;
      })();
    </script>
  </body>
</html>
