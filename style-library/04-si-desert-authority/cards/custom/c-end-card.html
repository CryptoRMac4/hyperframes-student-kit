<!doctype html>
<!--
  SI DESERT AUTHORITY · custom · end-card (opaque takeover, holds, no exit)
  Saguaro field. The horizon draws out from center with two sun arcs rising
  behind the real saguaro logo mark (assets/sic-logo.png from sonoranintel.com),
  then the Barlow Condensed wordmark in the live site's nav treatment, the
  tagline, and ONE CTA: bone text on terracotta-deep (small text rule, ~5.7:1)
  with a thin terracotta base line as the accent.
  Slots: tagline, cta.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: var(--saguaro); }
      #si-c-end-card {
        position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--saguaro); color: var(--bone); font-family: var(--font-body);
      }
      #si-c-end-card .horizon { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #si-c-end-card .horizon path { fill: none; stroke: var(--bone-line); stroke-width: 2; stroke-dasharray: 100; }
      #si-c-end-card .stack {
        position: absolute; left: 160px; top: 0; width: 1600px; height: 960px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      }
      #si-c-end-card .logo {
        display: block; width: 150px; height: 150px; border-radius: 22px;
        border: 2px solid var(--bone-line);
      }
      #si-c-end-card .wm-mask { margin-top: 44px; overflow: hidden; padding: 0 20px; }
      #si-c-end-card .wordmark {
        font-family: var(--font-display); font-weight: var(--wt-bold); font-size: 124px; line-height: 1.02;
        letter-spacing: var(--track-wordmark); text-transform: uppercase; color: var(--bone); white-space: nowrap;
      }
      #si-c-end-card .tagline {
        margin-top: 18px; max-width: 40ch; text-wrap: balance;
        font-size: 50px; font-weight: var(--wt-body); line-height: 1.3; color: var(--sand);
      }
      #si-c-end-card .cta {
        margin-top: 58px; padding: 24px 54px 26px; border-radius: var(--radius);
        background: var(--terracotta-deep); color: var(--bone); white-space: nowrap;
        border-bottom: 6px solid var(--terracotta);
        font-size: 42px; font-weight: var(--wt-semi); letter-spacing: 0.01em; line-height: 1.1;
      }
    </style>
  </head>
  <body>
    <div id="si-c-end-card" data-composition-id="si-c-end-card" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <svg class="horizon" viewBox="0 0 1920 1080" aria-hidden="true">
        <path d="M960 960 H0" pathLength="100" />
        <path d="M960 960 H1920" pathLength="100" />
        <path d="M400 960 A 560 560 0 0 1 1520 960" pathLength="100" />
        <path d="M530 960 A 430 430 0 0 1 1390 960" pathLength="100" />
      </svg>
      <div class="stack">
        <img class="logo" src="../../assets/sic-logo.png" width="150" height="150" alt="Sonoran Intelligence saguaro mark" />
        <div class="wm-mask"><div class="wordmark">Sonoran Intelligence</div></div>
        <div class="tagline" data-slot="tagline">Putting AI to work for local businesses.</div>
        <div class="cta" data-slot="cta">Get your free audit at sonoranintel.com</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const root = document.getElementById("si-c-end-card");
        const css = getComputedStyle(document.documentElement);
        const ease = (k, d) => css.getPropertyValue(k).trim() || d;
        const IN = ease("--gsap-in", "power3.out"), WIPE = ease("--gsap-wipe", "power2.inOut");
        const q = (s) => root.querySelector(s), qa = (s) => root.querySelectorAll(s);
        const paths = qa(".horizon path");

        const tl = gsap.timeline({ paused: true });
        tl.fromTo([paths[0], paths[1]], { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 1.2, ease: WIPE }, 0)
          .fromTo([paths[2], paths[3]], { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 1.6, ease: WIPE, stagger: 0.2 }, 0.3)
          .fromTo(q(".logo"), { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: IN }, 0.35)
          .fromTo(q(".wordmark"), { yPercent: 105 }, { yPercent: 0, duration: 0.8, ease: IN }, 0.7)
          .fromTo(q(".tagline"), { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: IN }, 1.2)
          .fromTo(q(".cta"), { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: IN }, 1.6)
          .fromTo(q(".stack"), { y: 0 }, { y: -6, duration: 3.7, ease: "none" }, 2.3);
        window.__timelines["si-c-end-card"] = tl;
      })();
    </script>
  </body>
</html>
